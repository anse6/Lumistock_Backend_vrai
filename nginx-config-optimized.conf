# Configuration Nginx optimisée pour Lumistock Backend

# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name app.lumistock.ansedev.com;
    return 301 https://$server_name$request_uri;
}

# Configuration HTTPS principale
server {
    listen 443 ssl http2;  # ✅ Ajouter http2 pour meilleure perf
    server_name app.lumistock.ansedev.com;

    # ========== SSL/TLS ==========
    ssl_certificate /etc/letsencrypt/live/app.lumistock.ansedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.lumistock.ansedev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ✅ AJOUT: En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========== Compression & Performance ==========
    # ✅ AJOUT: Compression gzip pour réduire la bande passante
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # ========== Upload & Body Size ==========
    # Taille max pour les uploads (images produits/profils — backend autorise 16Mo)
    client_max_body_size 20M;
    
    # ✅ AJOUT: Augmenter les timeouts pour les routes audio/lourdes
    send_timeout 120s;
    proxy_read_timeout 180s;  # ✅ Augmenté pour audio-summary et autres requêtes lourdes
    proxy_connect_timeout 30s;  # ✅ Augmenté car MongoDB peut être lent

    # ========== Frontend React ==========
    root /var/www/app.lumistock.ansedev.com/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # ✅ AJOUT: Cache busting pour les fichiers avec hash
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== Backend Flask API ==========
    location /api/ {
        proxy_pass http://127.0.0.1:3006/;
        
        # ✅ AJOUT: En-têtes supplémentaires pour API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # ✅ AJOUT: Buffering pour éviter les problèmes mémoire
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # ✅ AJOUT: Timeout augmenté pour routes audio/notifications
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        
        # ✅ AJOUT: Redirect des erreurs 502/503 vers une page friendly
        error_page 502 503 504 @backend_down;
    }

    # ========== Routes d'API spéciales ==========
    # ✅ AJOUT: Options pour CORS preflight requests
    location /api/notifications/audio-summary {
        proxy_pass http://127.0.0.1:3006/notifications/audio-summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout très long pour la génération d'audio
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        
        # Pas de cache pour l'audio (toujours frais)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ========== Fichiers uploadés ==========
    location /uploads/ {
        alias /var/www/app.lumistock.ansedev.com/backend/uploads/;
        
        # ✅ AJOUT: Cache long pour les images (immutables)
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # ✅ AJOUT: Éviter les répertoires vides
        location ~ /uploads/$ {
            return 403;
        }
    }

    # ========== Fichiers statiques Flask ==========
    location /static/ {
        alias /var/www/app.lumistock.ansedev.com/backend/static/;
        
        # Cache modéré (peut changer)
        expires 7d;
        add_header Cache-Control "public";
    }

    # ✅ AJOUT: Logs d'erreur
    error_log /var/log/nginx/lumistock_error.log warn;
    access_log /var/log/nginx/lumistock_access.log combined;

    # ✅ AJOUT: Page d'erreur backend down
    location @backend_down {
        default_type application/json;
        return 503 '{"error": "Backend temporairement indisponible. Réessayez dans quelques instants."}';
    }

    # ✅ AJOUT: Deny accès aux fichiers sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}
