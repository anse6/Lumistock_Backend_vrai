services:
  app:
    build: .
    container_name: tk-data_app
    ports:
      - "3006:3006"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lumistock_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Lumistock_bd}
      AUTO_CREATE_DATABASE: "false"
      AUTO_CREATE_SCHEMA: "true"
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["sh", "-c", "python -m scripts.migrate_database && flask run --host=0.0.0.0 --port=3006"]
    networks:
      - tk-data_network

  mysql:
    image: mysql:8.0
    container_name: lumistock_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lumistock_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Lumistock_bd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tk-data_network

volumes:
  mysql_data:
    driver: local

networks:
  tk-data_network:
    driver: bridge
